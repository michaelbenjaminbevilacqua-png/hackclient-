name: Build and publish browser client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eaglercraft-1.14-workspace-main
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build browser client
        run: ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx3G -Xms512M' :target_teavm_javascript:makeMainOfflineDownload

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload browser client
        uses: actions/upload-pages-artifact@v3
        with:
          path: eaglercraft-1.14-workspace-main/target_teavm_javascript/javascript

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
